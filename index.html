<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой вишлист</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFF9F4; --blush: #F7D6E0; --rose: #C2456F; --rose-dark: #9C2F56;
    --plum: #3D2233; --gold: #D9A94E; --lavender: #D9C7EC; --paper: #FFFDFB;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cream); color: var(--plum); font-family: 'Quicksand', sans-serif; min-height: 100vh; position: relative; overflow-x: hidden; }
  .bg-deco { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.5; }
  .wrap { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 48px 24px 80px; }
  header { text-align: center; margin-bottom: 36px; }
  .hero-svg { width: 120px; height: 120px; margin: 0 auto 8px; display: block; }
  h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 2.4rem; margin: 0 0 6px; color: var(--rose-dark); letter-spacing: -0.01em; }
  .subtitle-row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; font-size: 1rem; color: var(--plum); opacity: 0.75; }
  .wavy-divider { width: 100%; height: 20px; margin: 28px 0; }
  .list { display: flex; flex-direction: column; gap: 14px; }
  .item { position: relative; background: var(--paper); border-radius: 4px 16px 16px 4px; padding: 14px 90px 14px 14px; cursor: pointer; border-left: 4px solid var(--rose); box-shadow: 2px 3px 0 rgba(194, 69, 111, 0.08); transition: transform 0.15s ease; display: flex; align-items: flex-start; gap: 14px; }
  .item:nth-child(3n+1) { border-left-color: var(--rose); }
  .item:nth-child(3n+2) { border-left-color: var(--gold); }
  .item:nth-child(3n)   { border-left-color: var(--lavender); }
  .item-photo { width: 64px; height: 64px; flex-shrink: 0; border-radius: 10px; object-fit: cover; background: var(--cream); border: 1px solid var(--blush); }
  .item-text { min-width: 0; }
  .item.got { opacity: 0.55; }
  .item.got .item-title { text-decoration: line-through; text-decoration-color: var(--rose); }
  .item.priority { border: 2px solid var(--gold); border-left: 4px solid var(--gold); background: linear-gradient(135deg, #FFFDF8, #FFF6E6); }
  .item.priority .item-title { color: var(--rose-dark); }
  .item-title { font-weight: 600; font-size: 1.05rem; margin: 0 0 2px; cursor: pointer; }
  .item-note { font-size: 0.85rem; color: var(--rose-dark); opacity: 0.8; margin: 0; }
  .tag { position: absolute; top: 14px; right: 16px; font-size: 0.72rem; font-weight: 700; text-transform: lowercase; color: var(--gold); opacity: 0.85; }
  .item.got .tag { color: var(--rose); }
  .tag.multi { color: var(--lavender); opacity: 1; }
  .footnote { text-align: center; margin-top: 36px; font-size: 0.82rem; color: var(--plum); opacity: 0.45; }
  @media (max-width: 480px) { h1 { font-size: 1.9rem; } .wrap { padding: 32px 16px 60px; } }
  .lightbox { display: none; position: fixed; inset: 0; background: rgba(20, 10, 15, 0.85); z-index: 999; align-items: center; justify-content: center; cursor: zoom-out; padding: 24px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 95vw; max-height: 95vh; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); cursor: default; }
  .item-photo { cursor: zoom-in; }
</style>
</head>
<body>

<svg class="bg-deco" id="bgDeco"></svg>

<div class="wrap">
  <header>
    <svg class="hero-svg" viewBox="0 0 100 100" fill="none">
      <ellipse cx="50" cy="78" rx="28" ry="7" fill="#F7D6E0"/>
      <rect x="30" y="55" width="40" height="22" rx="3" fill="#C2456F"/>
      <rect x="30" y="55" width="40" height="7" fill="#9C2F56"/>
      <rect x="24" y="42" width="52" height="15" rx="3" fill="#D9A94E"/>
      <rect x="24" y="42" width="52" height="5" fill="#c68f36"/>
      <line x1="50" y1="42" x2="50" y2="24" stroke="#9C2F56" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M50 24 C 46 18, 54 15, 50 8" stroke="#D9A94E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <circle cx="38" cy="49" r="2.5" fill="#fff"/>
      <circle cx="50" cy="49" r="2.5" fill="#fff"/>
      <circle cx="62" cy="49" r="2.5" fill="#fff"/>
    </svg>
    <h1>Список желаний</h1>
    <div class="subtitle-row">
      <span>babyzoda</span>
      <span>·</span>
      <span>09.10.06</span>
    </div>
  </header>

  <svg class="wavy-divider" viewBox="0 0 600 20" preserveAspectRatio="none">
    <path d="M0 10 Q 15 0, 30 10 T 60 10 T 90 10 T 120 10 T 150 10 T 180 10 T 210 10 T 240 10 T 270 10 T 300 10 T 330 10 T 360 10 T 390 10 T 420 10 T 450 10 T 480 10 T 510 10 T 540 10 T 570 10 T 600 10"
      stroke="#D9A94E" stroke-width="2" fill="none" stroke-linecap="round"/>
  </svg>

  <div class="list" id="list"></div>
  <p class="footnote">нажми на желание, чтобы отметить «уже забронировано» — видно всем, кто откроет список</p>
</div>

<div id="lightbox" class="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img" src="" alt="">
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCzAmolB-urpaVOC1LUqlUe1ki4JQWxWrI",
  authDomain: "wishlist-381c1.firebaseapp.com",
  projectId: "wishlist-381c1",
  storageBucket: "wishlist-381c1.firebasestorage.app",
  messagingSenderId: "45860822873",
  appId: "1:45860822873:web:5aecafed6d7763480f3648"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const docRef = doc(db, "wishlist", "main-v8");

const IMAGES = {
  basta: "https://github.com/babyzoda/babyzoda.github.io/raw/main/basta.jpg",
  namaznik: "https://github.com/babyzoda/babyzoda.github.io/raw/main/namaznik.jpg",

  bag1: "https://github.com/babyzoda/babyzoda.github.io/raw/main/bag1.jpg",
  bag2: "https://github.com/babyzoda/babyzoda.github.io/raw/main/bag2.jpg",
  bag3: "https://github.com/babyzoda/babyzoda.github.io/raw/main/bag3.jpg",
  bag4: "https://github.com/babyzoda/babyzoda.github.io/raw/main/bag4.jpg",
  bag5: "https://github.com/babyzoda/babyzoda.github.io/raw/main/bag5.jpg",

  goldenapple: "https://github.com/babyzoda/babyzoda.github.io/raw/main/goldenapple.jpg",
  i6: "https://github.com/babyzoda/babyzoda.github.io/raw/main/i6.jpg",
  tryme1: "https://github.com/babyzoda/babyzoda.github.io/raw/main/tryme1.jpg",

  b1: "https://github.com/babyzoda/babyzoda.github.io/raw/main/b1.jpg",
  b2: "https://github.com/babyzoda/babyzoda.github.io/raw/main/b2.jpg",
  b3: "https://github.com/babyzoda/babyzoda.github.io/raw/main/b3.jpg",
  b4: "https://github.com/babyzoda/babyzoda.github.io/raw/main/b4.jpg",
  b5: "https://github.com/babyzoda/babyzoda.github.io/raw/main/b5.jpg",
  b6: "https://github.com/babyzoda/babyzoda.github.io/raw/main/b6.jpg",
  b7: "https://github.com/babyzoda/babyzoda.github.io/raw/main/b7.jpg",
  b8: "https://github.com/babyzoda/babyzoda.github.io/raw/main/b8.jpg",
  b9: "https://github.com/babyzoda/babyzoda.github.io/raw/main/b9.jpg",

  ac_a: "https://github.com/babyzoda/babyzoda.github.io/raw/main/ac_a.jpg",
  ac_b: "https://github.com/babyzoda/babyzoda.github.io/raw/main/ac_b.jpg",
  ac_c: "https://github.com/babyzoda/babyzoda.github.io/raw/main/ac_c.jpg"
};

const DEFAULT_ITEMS = [
  { id: 'basta-ticket', images: ['basta'], text: '🎤 Билет на концерт Басты в Ташкенте', note: 'Humo Arena — горячее желание!', reserved: false, priority: true },
  { id: 'navai-ticket', text: '🎫 Билет на концерт Наваи', note: '8 октября, Ташкент — за день до моего ДР (9-го)! Самое главное желание', reserved: false, priority: true },
  { id: 'dress1', images: ['namaznik'], text: 'Намазник 🤍', note: 'было бы приятно получить что-то подобное в подарок', reserved: false },
  { id: 'bags-set', images: ['bag1','bag2','bag3','bag4','bag5'], text: 'Сумочка ✨', note: 'в таком стиле (мини-бокс на цепочке) или на ваше усмотрение — только без крупных логотипов бренда', reserved: false },
  { id: 'i5', images: ['goldenapple'], text: 'Сертификат Золотое Яблоко 💛', note: 'на любую сумму ♡', reserved: false, multiple: true },
  { id: 'aikerim-cert', text: 'Сертификат в aikerim 💌', note: 'на любую сумму', reserved: false, multiple: true },
  { id: 'tryme-cert', images: ['tryme1'], text: 'Сертификат TRY ME 💗', note: 'на любую сумму', reserved: false, multiple: true },
  { id: 'i6', text: 'Кроссовки New Balance 530', note: 'белые с серебром — важны именно этот цвет и размер(37.5), в Стамбуле и Шымкенте не нашла', reserved: false },
  
  // Khaled Hosseini books
  { id: 'khaled-1', images: ['b1'], text: 'Халед Хоссейни — Тысяча сияющих солнц 📚', note: 'книга', reserved: false },
  { id: 'khaled-2', images: ['b2'], text: 'Халед Хоссейни — Бегущий за ветром 📚', note: 'книга', reserved: false },

  // Magistral series books
  { id: 'mag-1', images: ['b3'], text: 'Граф Монте-Кристо (2 тома) — серия «Магистраль»', note: 'оформление Эксмо', reserved: false },
  { id: 'mag-2', images: ['b4'], text: 'Джейн Эйр — серия «Магистраль»', note: 'оформление Эксмо', reserved: false },
  { id: 'mag-3', images: ['b5'], text: 'Энн из Зелёных Мезонинов — серия «Магистраль»', note: 'оформление Эксмо', reserved: false },
  { id: 'mag-4', images: ['b6'], text: 'Поллианна — серия «Магистраль»', note: 'оформление Эксмо', reserved: false },
  { id: 'mag-5', images: ['b7'], text: 'Идиот — серия «Магистраль»', note: 'оформление Эксмо', reserved: false },
  { id: 'mag-6', images: ['b8'], text: 'Илиада — серия «Магистраль»', note: 'оформление Эксмо', reserved: false },
  { id: 'mag-7', images: ['b9'], text: 'Грозовой перевал — серия «Магистраль»', note: 'оформление Эксмо', reserved: false },
  { id: 'mag-8', images: ['b9'], text: 'Хорошие жёны — серия «Магистраль»', note: 'оформление Эксмо', reserved: false },

  // Agatha Christie books
  { id: 'agatha-1', images: ['ac_a'], text: 'Агата Кристи — По направлению к нулю', note: 'новое издание', reserved: false },
  { id: 'agatha-2', images: ['ac_b'], text: 'Агата Кристи — Смерть приходит в конце', note: 'новое издание', reserved: false },
  { id: 'agatha-3', images: ['ac_c'], text: 'Агата Кристи — Почему не Эванс?', note: 'новое издание', reserved: false }
];

let items = DEFAULT_ITEMS;
render(); // Renders instantly so the page is never blank

async function loadAll() {
  try {
    const snap = await getDoc(docRef);
    if (snap.exists() && snap.data() && Array.isArray(snap.data().list) && snap.data().list.length > 0) {
      items = snap.data().list;
      render();
    } else {
      items = DEFAULT_ITEMS;
      render();
      await setDoc(docRef, { list: DEFAULT_ITEMS });
    }
  } catch (e) {
    console.warn('Firebase sync skipped, using local items:', e);
    items = DEFAULT_ITEMS;
    render();
  }
}

async function saveItems() {
  try {
    await setDoc(docRef, { list: items });
  } catch (e) {
    console.error('save failed', e);
  }
}

window.openLightbox = function(src) {
  if (!src) return;
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
};
window.closeLightbox = function() {
  document.getElementById('lightbox').classList.remove('open');
};
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeLightbox();
});

function render() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  items.forEach(it => {
    const div = document.createElement('div');
    div.className = 'item' + (it.reserved ? ' got' : '') + (it.priority ? ' priority' : '');
    let photoHtml = '';
    if (it.images && it.images.length === 1 && IMAGES[it.images[0]]) {
      photoHtml = `<img class="item-photo" src="${IMAGES[it.images[0]]}" alt="" onerror="this.style.display='none'" onclick="event.stopPropagation();openLightbox('${IMAGES[it.images[0]}')">`;
    } else if (IMAGES[it.id]) {
      photoHtml = `<img class="item-photo" src="${IMAGES[it.id]}" alt="" onerror="this.style.display='none'" onclick="event.stopPropagation();openLightbox('${IMAGES[it.id]}')">`;
    }
    
    div.innerHTML = `
      ${photoHtml}
      <div class="item-text">
        <p class="item-title">${escapeHtml(it.text)}</p>
        ${it.note ? `<p class="item-note">${escapeHtml(it.note)}</p>` : ''}
      </div>
      ${it.multiple ? '<span class="tag multi">можно нескольким</span>' : `<span class="tag">${it.reserved ? 'забронировано' : 'свободно'}</span>`}
    `;
    if (!it.multiple) {
      div.querySelector('.item-title').addEventListener('click', () => toggleReserved(it.id));
    } else {
      div.classList.remove('got');
      div.style.cursor = 'default';
    }
    list.appendChild(div);
  });
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function toggleReserved(id) {
  const it = items.find(i => i.id === id);
  if (it) {
    it.reserved = !it.reserved;
    render();
    await saveItems();
  }
}

(function drawBg() {
  const svg = document.getElementById('bgDeco');
  svg.setAttribute('viewBox', '0 0 400 800');
  svg.setAttribute('preserveAspectRatio', 'none');
  const colors = ['#F7D6E0', '#D9C7EC', '#D9A94E'];
  let shapes = '';
  const positions = [[30,60],[370,120],[20,280],[380,340],[15,520],[385,600],[40,720],[360,760]];
  positions.forEach((p, i) => {
    const c = colors[i % colors.length];
    const r = 5 + (i % 3) * 2;
    shapes += `<circle cx="${p[0]}" cy="${p[1]}" r="${r}" fill="${c}" opacity="0.5"/>`;
  });
  svg.innerHTML = shapes;
})();

loadAll();
</script>

</body>
</html>
