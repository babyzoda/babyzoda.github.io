<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой вишлист</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFF9F4; --blush: #F7D6E0; --rose: #C2456F; --rose-dark: #9C2F56;
    --plum: #3D2233; --gold: #D9A94E; --lavender: #D9C7EC; --paper: #FFFDFB;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cream); color: var(--plum); font-family: 'Quicksand', sans-serif; min-height: 100vh; position: relative; overflow-x: hidden; }
  .bg-deco { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.5; }
  .wrap { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 48px 24px 80px; }
  header { text-align: center; margin-bottom: 36px; }
  .hero-svg { width: 120px; height: 120px; margin: 0 auto 8px; display: block; }
  h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 2.4rem; margin: 0 0 6px; color: var(--rose-dark); letter-spacing: -0.01em; }
  .subtitle-row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; font-size: 1rem; color: var(--plum); opacity: 0.75; }
  .wavy-divider { width: 100%; height: 20px; margin: 28px 0; }
  .list { display: flex; flex-direction: column; gap: 14px; }
  .item { position: relative; background: var(--paper); border-radius: 4px 16px 16px 4px; padding: 14px 90px 14px 14px; cursor: pointer; border-left: 4px solid var(--rose); box-shadow: 2px 3px 0 rgba(194, 69, 111, 0.08); transition: transform 0.15s ease; display: flex; align-items: flex-start; gap: 14px; }
  .item:nth-child(3n+1) { border-left-color: var(--rose); }
  .item:nth-child(3n+2) { border-left-color: var(--gold); }
  .item:nth-child(3n)   { border-left-color: var(--lavender); }
  .item-photo { width: 64px; height: 64px; flex-shrink: 0; border-radius: 10px; object-fit: cover; background: var(--cream); border: 1px solid var(--blush); }
  .item-photo-grid { flex-shrink: 0; width: 64px; height: 64px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; border-radius: 10px; overflow: hidden; border: 1px solid var(--blush); }
  .item-photo-grid .item-photo { width: 100%; height: 100%; border: none; border-radius: 0; }
  .item-text { min-width: 0; }
  .item.got { opacity: 0.55; }
  .item.got .item-title { text-decoration: line-through; text-decoration-color: var(--rose); }
  .item.priority { border: 2px solid var(--gold); border-left: 4px solid var(--gold); background: linear-gradient(135deg, #FFFDF8, #FFF6E6); }
  .item.priority .item-title { color: var(--rose-dark); }
  .item-title { font-weight: 600; font-size: 1.05rem; margin: 0 0 2px; cursor: pointer; }
  .item-note { font-size: 0.85rem; color: var(--rose-dark); opacity: 0.8; margin: 0; }
  .thumb-strip { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .strip-photo { width: 46px; height: 46px; border-radius: 8px; object-fit: cover; border: 1px solid var(--blush); }
  .tag { position: absolute; top: 14px; right: 16px; font-size: 0.72rem; font-weight: 700; text-transform: lowercase; color: var(--gold); opacity: 0.85; }
  .item.got .tag { color: var(--rose); }
  .tag.multi { color: var(--lavender); opacity: 1; }
  .footnote { text-align: center; margin-top: 36px; font-size: 0.82rem; color: var(--plum); opacity: 0.45; }
  @media (max-width: 480px) { h1 { font-size: 1.9rem; } .wrap { padding: 32px 16px 60px; } }
  .lightbox { display: none; position: fixed; inset: 0; background: rgba(20, 10, 15, 0.85); z-index: 999; align-items: center; justify-content: center; cursor: zoom-out; padding: 24px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 95vw; max-height: 95vh; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); cursor: default; }
  .item-photo, .item-photo-grid, .strip-photo { cursor: zoom-in; }
</style>
</head>

// ============================================================
// FIRESTORE
// ============================================================
async function loadAll() {
  try {
    const snap = await getDoc(docRef);
    if (snap.exists() && Array.isArray(snap.data().list)) {
      items = snap.data().list;
    } else {
      items = DEFAULT_ITEMS;
      await saveItems();
    }
  } catch (e) {
    console.error('load failed', e);
    items = DEFAULT_ITEMS;
  }
  render();
}

async function saveItems() {
  try {
    await setDoc(docRef, { list: items });
  } catch (e) {
    console.error('save failed', e);
  }
}

// ============================================================
// LIGHTBOX
// ============================================================
window.openLightbox = function(src) {
  if (!src) return;
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
};
window.closeLightbox = function() {
  document.getElementById('lightbox').classList.remove('open');
};
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeLightbox();
});

// ============================================================
// RENDER
// ============================================================
function render() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  items.forEach(it => {
    const div = document.createElement('div');
    div.className = 'item' + (it.reserved ? ' got' : '') + (it.priority ? ' priority' : '');
    let photoHtml = '';
    if (it.priority) {
      photoHtml = `<svg class="item-photo" viewBox="0 0 64 64" style="background:var(--rose);"><path d="M10 24 a4 4 0 0 0 0 -8 v-4 a4 4 0 0 1 4 -4 h36 a4 4 0 0 1 4 4 v4 a4 4 0 0 0 0 8 v16 a4 4 0 0 0 0 8 v4 a4 4 0 0 1 -4 4 h-36 a4 4 0 0 1 -4 -4 v-4 a4 4 0 0 0 0 -8 z" fill="none" stroke="white" stroke-width="2"/><line x1="24" y1="10" x2="24" y2="54" stroke="white" stroke-width="2" stroke-dasharray="3,3"/></svg>`;
    } else if (it.images && it.images.length > 1 && it.images.length <= 4) {
      const cols = it.images.length === 4 ? 2 : it.images.length;
      const thumbs = it.images.map(id => IMAGES[id] ? `<img class="item-photo grid" src="${IMAGES[id]}" alt="" onerror="this.style.display='none'" onclick="event.stopPropagation();openLightbox('${IMAGES[id]}')">` : '').join('');
      if (thumbs) {
        photoHtml = `<div class="item-photo-grid" style="grid-template-columns: repeat(${cols}, 1fr); grid-template-rows: ${it.images.length === 4 ? '1fr 1fr' : '1fr'};">${thumbs}</div>`;
      }
    } else if (it.images && it.images.length === 1 && IMAGES[it.images[0]]) {
      photoHtml = `<img class="item-photo" src="${IMAGES[it.images[0]]}" alt="" onerror="this.style.display='none'" onclick="event.stopPropagation();openLightbox('${IMAGES[it.images[0]]}')">`;
    } else if (IMAGES[it.id]) {
      photoHtml = `<img class="item-photo" src="${IMAGES[it.id]}" alt="" onerror="this.style.display='none'" onclick="event.stopPropagation();openLightbox('${IMAGES[it.id]}')">`;
    }
    const stripHtml = (it.images && it.images.length > 4)
      ? `<div class="thumb-strip">${it.images.map(id => IMAGES[id] ? `<img class="strip-photo" src="${IMAGES[id]}" alt="" onerror="this.style.display='none'" onclick="event.stopPropagation();openLightbox('${IMAGES[id]}')">` : '').join('')}</div>`
      : '';
    div.innerHTML = `
      ${photoHtml}
      <div class="item-text">
        <p class="item-title">${escapeHtml(it.text)}</p>
        ${it.note ? `<p class="item-note">${escapeHtml(it.note)}</p>` : ''}
        ${stripHtml}
      </div>
      ${it.multiple ? '<span class="tag multi">можно нескольким</span>' : `<span class="tag">${it.reserved ? 'забронировано' : 'свободно'}</span>`}
    `;
    if (!it.multiple) {
      div.querySelector('.item-title').addEventListener('click', () => toggleReserved(it.id));
    } else {
      div.classList.remove('got');
      div.style.cursor = 'default';
    }
    list.appendChild(div);
  });
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function toggleReserved(id) {
  const it = items.find(i => i.id === id);
  if (it) {
    it.reserved = !it.reserved;
    render();
    await saveItems();
  }
}

// ============================================================
// BACKGROUND DECORATION
// ============================================================
(function drawBg() {
  const svg = document.getElementById('bgDeco');
  svg.setAttribute('viewBox', '0 0 400 800');
  svg.setAttribute('preserveAspectRatio', 'none');
  const colors = ['#F7D6E0', '#D9C7EC', '#D9A94E'];
  let shapes = '';
  const positions = [[30,60],[370,120],[20,280],[380,340],[15,520],[385,600],[40,720],[360,760]];
  positions.forEach((p, i) => {
    const c = colors[i % colors.length];
    const r = 5 + (i % 3) * 2;
    shapes += `<circle cx="${p[0]}" cy="${p[1]}" r="${r}" fill="${c}" opacity="0.5"/>`;
  });
  svg.innerHTML = shapes;
})();

loadAll();
</script>
