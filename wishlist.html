<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой вишлист</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFF9F4; --blush: #F7D6E0; --rose: #C2456F; --rose-dark: #9C2F56;
    --plum: #3D2233; --gold: #D9A94E; --lavender: #D9C7EC; --paper: #FFFDFB;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cream); color: var(--plum); font-family: 'Quicksand', sans-serif; min-height: 100vh; position: relative; overflow-x: hidden; }
  .bg-deco { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.5; }
  .wrap { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 48px 24px 80px; }
  header { text-align: center; margin-bottom: 36px; }
  .hero-svg { width: 120px; height: 120px; margin: 0 auto 8px; display: block; }
  h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 2.4rem; margin: 0 0 6px; color: var(--rose-dark); letter-spacing: -0.01em; }
  .subtitle-row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; font-size: 1rem; color: var(--plum); opacity: 0.75; }
  .wavy-divider { width: 100%; height: 20px; margin: 28px 0; }
  .list { display: flex; flex-direction: column; gap: 14px; }
  .item { position: relative; background: var(--paper); border-radius: 4px 16px 16px 4px; padding: 14px 90px 14px 14px; cursor: pointer; border-left: 4px solid var(--rose); box-shadow: 2px 3px 0 rgba(194, 69, 111, 0.08); transition: transform 0.15s ease; display: flex; align-items: flex-start; gap: 14px; }
  .item:nth-child(3n+1) { border-left-color: var(--rose); }
  .item:nth-child(3n+2) { border-left-color: var(--gold); }
  .item:nth-child(3n)   { border-left-color: var(--lavender); }
  .item-photo { width: 64px; height: 64px; flex-shrink: 0; border-radius: 10px; object-fit: cover; background: var(--cream); border: 1px solid var(--blush); }
  .item-photo-grid { flex-shrink: 0; width: 64px; height: 64px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; border-radius: 10px; overflow: hidden; border: 1px solid var(--blush); }
  .item-photo-grid .item-photo { width: 100%; height: 100%; border: none; border-radius: 0; }
  .item-text { min-width: 0; }
  .item.got { opacity: 0.55; }
  .item.got .item-title { text-decoration: line-through; text-decoration-color: var(--rose); }
  .item.priority { border: 2px solid var(--gold); border-left: 4px solid var(--gold); background: linear-gradient(135deg, #FFFDF8, #FFF6E6); }
  .item.priority .item-title { color: var(--rose-dark); }
  .item-title { font-weight: 600; font-size: 1.05rem; margin: 0 0 2px; cursor: pointer; }
  .item-note { font-size: 0.85rem; color: var(--rose-dark); opacity: 0.8; margin: 0; }
  .thumb-strip { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .strip-photo { width: 46px; height: 46px; border-radius: 8px; object-fit: cover; border: 1px solid var(--blush); }
  .tag { position: absolute; top: 14px; right: 16px; font-size: 0.72rem; font-weight: 700; text-transform: lowercase; color: var(--gold); opacity: 0.85; }
  .item.got .tag { color: var(--rose); }
  .tag.multi { color: var(--lavender); opacity: 1; }
  .footnote { text-align: center; margin-top: 36px; font-size: 0.82rem; color: var(--plum); opacity: 0.45; }
  @media (max-width: 480px) { h1 { font-size: 1.9rem; } .wrap { padding: 32px 16px 60px; } }
  .lightbox { display: none; position: fixed; inset: 0; background: rgba(20, 10, 15, 0.85); z-index: 999; align-items: center; justify-content: center; cursor: zoom-out; padding: 24px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 95vw; max-height: 95vh; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); cursor: default; }
  .item-photo, .item-photo-grid, .strip-photo { cursor: zoom-in; }
</style>
</head>
<body>

<svg class="bg-deco" id="bgDeco"></svg>

<div class="wrap">
  <header>
    <svg class="hero-svg" viewBox="0 0 100 100" fill="none">
      <ellipse cx="50" cy="78" rx="28" ry="7" fill="#F7D6E0"/>
      <rect x="30" y="55" width="40" height="22" rx="3" fill="#C2456F"/>
      <rect x="30" y="55" width="40" height="7" fill="#9C2F56"/>
      <rect x="24" y="42" width="52" height="15" rx="3" fill="#D9A94E"/>
      <rect x="24" y="42" width="52" height="5" fill="#c68f36"/>
      <line x1="50" y1="42" x2="50" y2="24" stroke="#9C2F56" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M50 24 C 46 18, 54 15, 50 8" stroke="#D9A94E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <circle cx="38" cy="49" r="2.5" fill="#fff"/>
      <circle cx="50" cy="49" r="2.5" fill="#fff"/>
      <circle cx="62" cy="49" r="2.5" fill="#fff"/>
    </svg>
    <h1>Список желаний</h1>
    <div class="subtitle-row">
      <span>babyzoda</span>
      <span>·</span>
      <span>09.10.06</span>
    </div>
  </header>

  <svg class="wavy-divider" viewBox="0 0 600 20" preserveAspectRatio="none">
    <path d="M0 10 Q 15 0, 30 10 T 60 10 T 90 10 T 120 10 T 150 10 T 180 10 T 210 10 T 240 10 T 270 10 T 300 10 T 330 10 T 360 10 T 390 10 T 420 10 T 450 10 T 480 10 T 510 10 T 540 10 T 570 10 T 600 10"
      stroke="#D9A94E" stroke-width="2" fill="none" stroke-linecap="round"/>
  </svg>

  <div class="list" id="list"></div>
  <p class="footnote">нажми на желание, чтобы отметить «уже забронировано» — видно всем, кто откроет список</p>
</div>

<div id="lightbox" class="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img" src="" alt="">
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCzAmolB-urpaVOC1LUqlUe1ki4JQWxWrI",
  authDomain: "wishlist-381c1.firebaseapp.com",
  projectId: "wishlist-381c1",
  storageBucket: "wishlist-381c1.firebasestorage.app",
  messagingSenderId: "45860822873",
  appId: "1:45860822873:web:5aecafed6d7763480f3648"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const docRef = doc(db, "wishlist", "main");

let items = [];

// ============================================================
// IMAGES — PASTE YOUR BASE64 OR URL INSIDE THE QUOTES
// ============================================================
// Each key matches an image you want to show. Leave "" if empty.
// You can paste either:
//   - a base64 data string:  "data:image/jpeg;base64,/9j/4AAQ..."
//   - or a URL:              "https://i.imgur.com/abc123.jpg"
//
const IMAGES = {
  // priority ticket (unnamed — shows the SVG icon instead)
  // You can put an image here if you want it instead of the ticket icon:
  navai: "",

  // Намазник 🤍 — paste your namaznik base64 or URL here:
  namaznik: "https://github.com/ergashvaevmansur-tech/wishlist/raw/main/namaznik.jpg",
  // Сумочка ✨ — up to 5 bag photos
  bag1: "https://github.com/ergashvaevmansur-tech/wishlist/raw/main/bag1.jpg", bag2: "https://github.com/ergashvaevmansur-tech/wishlist/raw/main/bag2.jpg", bag3: "https://github.com/ergashvaevmansur-tech/wishlist/raw/main/bag3.jpg", bag4: "https://github.com/ergashvaevmansur-tech/wishlist/raw/main/bag4.jpg", bag5: "https://github.com/ergashvaevmansur-tech/wishlist/raw/main/bag5.jpg",

  // Набор TIGI — up to 4 photos
  i1: "https://github.com/ergashvaevmansur-tech/wishlist/raw/main/i1.jpg", i2: "https://github.com/ergashvaevmansur-tech/wishlist/raw/main/i2.jpg", i3: "https://github.com/ergashvaevmansur-tech/wishlist/raw/main/i3.jpg", i4: "https://github.com/ergashvaevmansur-tech/wishlist/raw/main/i4.jpg",

  // Кроссовки New Balance 530
  i6: "https://github.com/ergashvaevmansur-tech/wishlist/raw/main/i6.jpg",

  // Сертификат TRY ME 💗
  tryme1: "https://github.com/ergashvaevmansur-tech/wishlist/raw/main/tryme1.jpg",

  // Книги Халеда Хоссейни
  b1: "https://github.com/ergashvaevmansur-tech/wishlist/raw/main/b1.jpg", b2: "https://github.com/ergashvaevmansur-tech/wishlist/raw/main/b2.jpg",

  // Книги серия «Магистраль»
  b3: "https://github.com/ergashvaevmansur-tech/wishlist/raw/main/b3.jpg", b4: "https://github.com/ergashvaevmansur-tech/wishlist/raw/main/b4.jpg", b5: "https://github.com/ergashvaevmansur-tech/wishlist/raw/main/b5.jpg", b6: "https://github.com/ergashvaevmansur-tech/wishlist/raw/main/b6.jpg", b7: "https://github.com/ergashvaevmansur-tech/wishlist/raw/main/b7.jpg", b8: "https://github.com/ergashvaevmansur-tech/wishlist/raw/main/b8.jpg", b9: "https://github.com/ergashvaevmansur-tech/wishlist/raw/main/b9.jpg",

  // Агата Кристи
  ac_a: "https://github.com/ergashvaevmansur-tech/wishlist/raw/main/ac_a.jpg", ac_b: "https://github.com/ergashvaevmansur-tech/wishlist/raw/main/ac_b.jpg", ac_c: "https://github.com/ergashvaevmansur-tech/wishlist/raw/main/ac_c.jpg"
};

const DEFAULT_ITEMS = [
  { id: 'navai-ticket', text: '🎫 Билет на концерт Наваи', note: '8 октября, Ташкент — за день до моего ДР (9-го)! Самое главное желание', reserved: false, priority: true },
  { id: 'dress1', images: ['namaznik'], text: 'Намазник 🤍', note: 'было бы приятно получить что-то подобное в подарок', reserved: false },
  { id: 'bags-set', images: ['bag1','bag2','bag3','bag4','bag5'], text: 'Сумочка ✨', note: 'в таком стиле (мини-бокс на цепочке) или на ваше усмотрение — только без крупных логотипов бренда', reserved: false },
  { id: 'tigi-set', images: ['i1','i2','i3','i4'], text: 'Набор TIGI Bed Head', note: 'Queen For A Day (объём) · After Party (крем) · Some Like It Hot (термозащита) · Master Piece (лак)', reserved: false },
  { id: 'i5', text: 'Сертификат Золотое Яблоко 💛', note: 'на любую сумму ♡', reserved: false, multiple: true },
  { id: 'aikerim-cert', text: 'Сертификат в aikerim 💌', note: 'на любую сумму', reserved: false, multiple: true },
  { id: 'tryme-cert', images: ['tryme1'], text: 'Сертификат TRY ME 💗', note: 'на любую сумму', reserved: false, multiple: true },
  { id: 'i6', text: 'Кроссовки New Balance 530', note: 'белые с серебром — важны именно этот цвет и размер(37.5), в Стамбуле и Шымкенте не нашла', reserved: false },
  { id: 'khaled-set', images: ['b1','b2'], text: 'Книги Халеда Хоссейни 📚', note: 'Тысяча сияющих солнц · Бегущий за ветром', reserved: false },
  { id: 'books-set', images: ['b3','b4','b5','b6','b7','b8','b9'], text: 'Книги, серия «Магистраль» (Эксмо)', note: 'важна именно эта серия/оформление — Граф Монте-Кристо (2 тома), Джейн Эйр, Энн из Зелёных Мезонинов, Поллианна, Идиот, Илиада, Грозовой перевал, Хорошие жёны', reserved: false },
  { id: 'agatha-set', images: ['ac_a','ac_b','ac_c'], text: 'Агата Кристи, новые книги', note: 'По направлению к нулю · Смерть приходит в конце · Почему не Эванс?', reserved: false }
];

// ============================================================
// FIRESTORE
// ============================================================
async function loadAll() {
  try {
    const snap = await getDoc(docRef);
    if (snap.exists() && Array.isArray(snap.data().list)) {
      items = snap.data().list;
    } else {
      items = DEFAULT_ITEMS;
      await saveItems();
    }
  } catch (e) {
    console.error('load failed', e);
    items = DEFAULT_ITEMS;
  }
  render();
}

async function saveItems() {
  try {
    await setDoc(docRef, { list: items });
  } catch (e) {
    console.error('save failed', e);
  }
}

// ============================================================
// LIGHTBOX
// ============================================================
window.openLightbox = function(src) {
  if (!src) return;
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
};
window.closeLightbox = function() {
  document.getElementById('lightbox').classList.remove('open');
};
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeLightbox();
});

// ============================================================
// RENDER
// ============================================================
function render() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  items.forEach(it => {
    const div = document.createElement('div');
    div.className = 'item' + (it.reserved ? ' got' : '') + (it.priority ? ' priority' : '');
    let photoHtml = '';
    if (it.priority) {
      photoHtml = `<svg class="item-photo" viewBox="0 0 64 64" style="background:var(--rose);"><path d="M10 24 a4 4 0 0 0 0 -8 v-4 a4 4 0 0 1 4 -4 h36 a4 4 0 0 1 4 4 v4 a4 4 0 0 0 0 8 v16 a4 4 0 0 0 0 8 v4 a4 4 0 0 1 -4 4 h-36 a4 4 0 0 1 -4 -4 v-4 a4 4 0 0 0 0 -8 z" fill="none" stroke="white" stroke-width="2"/><line x1="24" y1="10" x2="24" y2="54" stroke="white" stroke-width="2" stroke-dasharray="3,3"/></svg>`;
    } else if (it.images && it.images.length > 1 && it.images.length <= 4) {
      const cols = it.images.length === 4 ? 2 : it.images.length;
      const thumbs = it.images.map(id => IMAGES[id] ? `<img class="item-photo grid" src="${IMAGES[id]}" alt="" onerror="this.style.display='none'" onclick="event.stopPropagation();openLightbox('${IMAGES[id]}')">` : '').join('');
      if (thumbs) {
        photoHtml = `<div class="item-photo-grid" style="grid-template-columns: repeat(${cols}, 1fr); grid-template-rows: ${it.images.length === 4 ? '1fr 1fr' : '1fr'};">${thumbs}</div>`;
      }
    } else if (it.images && it.images.length === 1 && IMAGES[it.images[0]]) {
      photoHtml = `<img class="item-photo" src="${IMAGES[it.images[0]]}" alt="" onerror="this.style.display='none'" onclick="event.stopPropagation();openLightbox('${IMAGES[it.images[0]]}')">`;
    } else if (IMAGES[it.id]) {
      photoHtml = `<img class="item-photo" src="${IMAGES[it.id]}" alt="" onerror="this.style.display='none'" onclick="event.stopPropagation();openLightbox('${IMAGES[it.id]}')">`;
    }
    const stripHtml = (it.images && it.images.length > 4)
      ? `<div class="thumb-strip">${it.images.map(id => IMAGES[id] ? `<img class="strip-photo" src="${IMAGES[id]}" alt="" onerror="this.style.display='none'" onclick="event.stopPropagation();openLightbox('${IMAGES[id]}')">` : '').join('')}</div>`
      : '';
    div.innerHTML = `
      ${photoHtml}
      <div class="item-text">
        <p class="item-title">${escapeHtml(it.text)}</p>
        ${it.note ? `<p class="item-note">${escapeHtml(it.note)}</p>` : ''}
        ${stripHtml}
      </div>
      ${it.multiple ? '<span class="tag multi">можно нескольким</span>' : `<span class="tag">${it.reserved ? 'забронировано' : 'свободно'}</span>`}
    `;
    if (!it.multiple) {
      div.querySelector('.item-title').addEventListener('click', () => toggleReserved(it.id));
    } else {
      div.classList.remove('got');
      div.style.cursor = 'default';
    }
    list.appendChild(div);
  });
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function toggleReserved(id) {
  const it = items.find(i => i.id === id);
  if (it) {
    it.reserved = !it.reserved;
    render();
    await saveItems();
  }
}

// ============================================================
// BACKGROUND DECORATION
// ============================================================
(function drawBg() {
  const svg = document.getElementById('bgDeco');
  svg.setAttribute('viewBox', '0 0 400 800');
  svg.setAttribute('preserveAspectRatio', 'none');
  const colors = ['#F7D6E0', '#D9C7EC', '#D9A94E'];
  let shapes = '';
  const positions = [[30,60],[370,120],[20,280],[380,340],[15,520],[385,600],[40,720],[360,760]];
  positions.forEach((p, i) => {
    const c = colors[i % colors.length];
    const r = 5 + (i % 3) * 2;
    shapes += `<circle cx="${p[0]}" cy="${p[1]}" r="${r}" fill="${c}" opacity="0.5"/>`;
  });
  svg.innerHTML = shapes;
})();

loadAll();
</script>

</body>
</html>
